# ==============================================================================
#  Override systemd untuk Redis
# ==============================================================================
#  BUKAN mengganti unit Redis dari paket — drop-in yang menambahi:
#
#      sudo mkdir -p /etc/systemd/system/redis-server.service.d
#      sudo cp redis-override.conf \
#          /etc/systemd/system/redis-server.service.d/antaride.conf
#      sudo systemctl daemon-reload
#      sudo systemctl restart redis-server
#
#  Periksa hasil gabungannya:  systemctl cat redis-server
# ==============================================================================

[Service]
# ------------------------------------------------------------------------------
#  Batas berkas terbuka
# ------------------------------------------------------------------------------
#  Redis memegang satu socket per klien. Yang menghubunginya di sini: setiap
#  worker Octane, setiap worker queue, dan layanan lokasi Go — masing-masing
#  dengan pool koneksinya sendiri.
#
#  Bawaan distribusi biasanya cukup. Ketika tidak, gejalanya BUKAN galat Redis:
#  yang muncul adalah Connection refused yang acak di aplikasi, pada request yang
#  tidak punya pola bersama — dan tidak ada apa pun di log Redis.
LimitNOFILE=65535

# ------------------------------------------------------------------------------
#  OOM: Redis dilindungi, tapi tidak kebal
# ------------------------------------------------------------------------------
#  OOMScoreAdjust=-500 membuat kernel memilih proses LAIN lebih dulu saat memori
#  habis. Alasannya: Redis memuat antrean job dan posisi driver, dan keduanya
#  tidak bisa dibangun ulang — sementara worker Octane yang dibunuh akan
#  di-restart systemd dalam tiga detik tanpa kehilangan apa pun.
#
#  BUKAN -1000 (kebal sepenuhnya): Redis yang tidak bisa dibunuh saat memori
#  habis berarti kernel membunuh PostgreSQL, dan itu jauh lebih buruk — data yang
#  sudah di-commit tetap ada, tapi seluruh aplikasi berhenti sampai ada yang
#  menyalakannya kembali secara manual.
OOMScoreAdjust=-500

# ------------------------------------------------------------------------------
#  Batas putaran restart
# ------------------------------------------------------------------------------
#  Redis yang gagal start karena satu salah ketik di konfigurasi TIDAK boleh
#  berputar restart tanpa henti. Putaran itu memenuhi journal dalam hitungan
#  detik, dan pesan galat aslinya — yang ada di baris pertama percobaan pertama —
#  tergulung jauh ke atas dan praktis tidak bisa ditemukan.
#
#  Dengan batas ini, systemd berhenti mencoba setelah 5 kali dalam 60 detik dan
#  meninggalkan unit dalam keadaan failed. Pesan galatnya menjadi baris terakhir
#  di journal, bukan yang pertama dari seribu.
StartLimitBurst=5
StartLimitIntervalSec=60
