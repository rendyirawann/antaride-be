# ==============================================================================
#  Antaride — konfigurasi Redis untuk produksi
# ==============================================================================
#  DROP-IN, bukan pengganti redis.conf. Pasang sebagai berkas terpisah supaya
#  pembaruan paket Redis tidak menimpanya:
#
#      sudo cp antaride.conf /etc/redis/redis-antaride.conf
#      sudo chown redis:redis /etc/redis/redis-antaride.conf
#      sudo chmod 640 /etc/redis/redis-antaride.conf
#
#  lalu tambahkan di AKHIR /etc/redis/redis.conf:
#
#      include /etc/redis/redis-antaride.conf
#
#  Baris include harus di akhir: Redis memakai nilai TERAKHIR untuk direktif
#  yang muncul dua kali. Include di awal berarti seluruh isi berkas ini
#  ditimpa oleh redis.conf.
#
#      sudo systemctl restart redis-server
#      redis-cli -a PASSWORD CONFIG GET maxmemory-policy
# ==============================================================================

# ------------------------------------------------------------------------------
#  HANYA LOCALHOST
# ------------------------------------------------------------------------------
#  Redis tidak punya TLS secara bawaan, dan sebelum ACL (6.0) tidak punya
#  autentikasi berlapis. Redis yang terbuka ke internet adalah salah satu cara
#  paling umum server diambil alih: penyerang menulis kunci SSH lewat
#  CONFIG SET dir + SAVE, lalu masuk lewat SSH.
#
#  Semua yang memakainya — Octane, worker queue, layanan lokasi Go — berada di
#  host yang sama.
bind 127.0.0.1 ::1
protected-mode yes
port 6379

# ------------------------------------------------------------------------------
#  Password
# ------------------------------------------------------------------------------
#  Bukan pengganti bind di atas, tapi lapis kedua: proses lain di host yang sama
#  juga tidak boleh membaca data ini. Di server bersama, localhost bukan batas
#  kepercayaan.
#
#  HARUS sama dengan REDIS_PASSWORD di .env DAN dengan ANTARIDE_REDIS_PASSWORD
#  di /etc/antaride/location.env. Kalau salah satu berbeda, gejalanya berbeda
#  pula dan keduanya membingungkan: Laravel gagal seluruhnya dengan galat yang
#  jelas, sementara layanan lokasi gagal DIAM-DIAM pada setiap ping — yang
#  terlihat di aplikasi driver hanya peringatan posisi tidak terkirim.
requirepass GANTI_DENGAN_PASSWORD_PANJANG_ACAK

# ------------------------------------------------------------------------------
#  PERINTAH BERBAHAYA DIMATIKAN
# ------------------------------------------------------------------------------
#  FLUSHALL menghapus posisi seluruh driver, seluruh quote yang belum jadi
#  order, dan seluruh lock — dalam satu perintah, tanpa konfirmasi. Satu salah
#  ketik saat memeriksa produksi sudah cukup.
#
#  CONFIG dimatikan karena dialah yang dipakai menulis berkas sembarang ke disk
#  (CONFIG SET dir + SAVE). Kalau perlu mengubah konfigurasi: ubah berkas ini,
#  lalu restart.
#
#  KEYS memindai SELURUH keyspace dan memblokir Redis selama pemindaiannya.
#  Redis satu thread, jadi itu berarti seluruh aplikasi berhenti selama
#  pemindaian. Pakai SCAN.
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command CONFIG ""
rename-command KEYS ""

# ------------------------------------------------------------------------------
#  MEMORI — DAN INI YANG PALING MUDAH SALAH
# ------------------------------------------------------------------------------
#  allkeys-lru SALAH untuk Antaride, walaupun itu yang paling sering disarankan
#  untuk Redis sebagai cache.
#
#  Alasannya: Redis di sini BUKAN hanya cache. Dia memuat empat hal, dan tidak
#  satu pun boleh hilang begitu saja:
#
#    posisi driver (GEOADD)    hilang = driver hilang dari pencocokan, dan dia
#                              online tanpa satu pun order masuk
#    quote                     hilang = penumpang menekan Pesan dan mendapat
#                              "harga sudah kadaluarsa" padahal baru 10 detik
#    lock order                hilang = dua driver bisa menerima order yang sama
#    antrean job               hilang = job HILANG, termasuk pembukuan dompet
#
#  allkeys-lru membuang kunci APA PUN saat memori penuh, termasuk keempatnya, dan
#  tidak ada satu pun galat yang muncul. Yang terjadi hanya perilaku yang tidak
#  bisa dijelaskan.
#
#  volatile-lru hanya membuang kunci yang PUNYA TTL. Antrean job dan lock tidak
#  punya TTL, jadi keduanya tidak akan pernah dibuang. Yang dibuang lebih dulu
#  adalah cache dan quote lama — yang memang boleh hilang.
#
#  Kalau memori benar-benar habis dan tidak ada lagi kunci ber-TTL yang bisa
#  dibuang, Redis menolak tulisan baru dengan galat. Itu JAUH lebih baik daripada
#  membuang antrean job diam-diam.
maxmemory 512mb
maxmemory-policy volatile-lru

# ------------------------------------------------------------------------------
#  PERSISTENSI: AOF, BUKAN HANYA RDB
# ------------------------------------------------------------------------------
#  Yang dipertaruhkan antrean job. RDB menyimpan snapshot setiap beberapa menit,
#  jadi server yang mati kehilangan seluruh job dalam jendela itu — dan di antara
#  job itu ada pembukuan dompet dan penyelesaian order.
#
#  appendfsync everysec, bukan always: always menulis ke disk untuk SETIAP
#  perintah, dan dengan 250 ping GPS per detik itu berarti 250 fsync per detik.
#  everysec kehilangan paling banyak satu detik terakhir — dan satu detik ping
#  GPS tidak berarti apa pun, karena ping berikutnya membawa posisi yang lebih
#  baru.
appendonly yes
appendfsync everysec

# RDB tetap dinyalakan sebagai cadangan kedua. Formatnya lebih kecil dan lebih
# cepat dimuat: AOF yang dipakai untuk pemulihan, RDB untuk backup harian.
save 900 1
save 300 10
save 60 10000

# ------------------------------------------------------------------------------
#  YANG TIDAK BOLEH DIUBAH TANPA MEMBACA INI
# ------------------------------------------------------------------------------
#  Nomor database HARUS cukup untuk pemisahan di config/database.php. Layanan
#  lokasi Go menulis ke DB yang SAMA dengan yang dibaca PHP untuk pencocokan —
#  kalau nomornya berbeda, PHP membaca set kosong sementara Go menulis dengan
#  benar. Tidak ada galat sama sekali.
databases 16

# Klien yang idle TIDAK diputus.
#
# Worker queue dan layanan lokasi memegang koneksi lama yang bisa menganggur di
# jam sepi. timeout yang aktif memutusnya, dan yang terjadi berikutnya adalah
# job pertama setelah jam sepi gagal dengan Connection reset by peer.
timeout 0

# TCP keepalive tetap menyala supaya koneksi yang MATI — bukan yang menganggur —
# tetap dibersihkan.
tcp-keepalive 300

# ------------------------------------------------------------------------------
#  Log
# ------------------------------------------------------------------------------
loglevel notice
logfile /var/log/redis/redis-server.log

# Perintah yang lebih lambat dari 10 ms dicatat.
#
# Ambangnya rendah dengan sengaja. Redis satu thread: satu perintah 100 ms
# berarti SELURUH aplikasi berhenti 100 ms. Yang paling sering muncul di sini:
# KEYS (sudah dimatikan di atas) dan GEORADIUS dengan radius terlalu besar.
slowlog-log-slower-than 10000
slowlog-max-len 256
