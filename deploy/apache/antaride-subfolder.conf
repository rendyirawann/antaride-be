# ==============================================================================
#  Antaride di SUBFOLDER dengan Apache — https://domain-anda.id/antaride/
# ==============================================================================
#  Untuk server yang sudah memakai Apache. Kalau bebas memilih, Nginx lebih
#  cocok untuk Octane — lihat deploy/nginx/.
#
#  Modul yang WAJIB aktif:
#      sudo a2enmod proxy proxy_http headers rewrite ssl
#      sudo systemctl restart apache2
#
#  Pasang:
#      sudo cp antaride-subfolder.conf /etc/apache2/sites-available/antaride.conf
#      sudo a2ensite antaride
#      sudo apache2ctl configtest && sudo systemctl reload apache2
# ==============================================================================
#
#  ============================================================================
#   DUA CARA, DAN PILIHANNYA MENENTUKAN BANYAK HAL
#  ============================================================================
#   A. PHP-FPM langsung ke public/ — TANPA Octane.
#      Paling sederhana, dan subfolder bekerja SENDIRI: Apache mengisi
#      SCRIPT_NAME dengan /antaride/index.php, dan Laravel membaca base URL
#      dari sana. Tidak butuh X-Forwarded-Prefix sama sekali.
#
#      Yang hilang: kecepatan Octane. Setiap request memuat ulang seluruh
#      framework — untuk API mobile yang dipanggil ratusan kali per menit,
#      bedanya nyata.
#
#   B. Proxy ke Octane — seperti konfigurasi Nginx.
#      Lebih cepat, dan menuntut X-Forwarded-Prefix disetel manual di bawah.
#
#   Blok A aktif secara bawaan di berkas ini. Untuk memakai B, komentari blok A
#   dan buka komentar blok B.
#  ============================================================================

<VirtualHost *:443>
    ServerName domain-anda.id

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/domain-anda.id/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/domain-anda.id/privkey.pem
    SSLProtocol -all +TLSv1.2 +TLSv1.3

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Strict-Transport-Security "max-age=31536000"

    # Lihat penjelasan angkanya di deploy/nginx/antaride-subfolder.conf:
    # 12 MB, lebih besar daripada batas 8 MB di validator Laravel, supaya
    # penolakan unggahan datang dari Laravel (JSON, menyebut ukurannya) dan
    # bukan dari Apache (HTML 413 yang tidak menyebut apa pun).
    LimitRequestBody 12582912

    # ==========================================================================
    #  BLOK A — PHP-FPM langsung ke public/  (AKTIF)
    # ==========================================================================
    #  Subfolder bekerja sendiri di sini. Laravel membaca base URL dari
    #  SCRIPT_NAME yang diisi Apache, jadi route(), url(), dan asset() semuanya
    #  memuat /antaride tanpa konfigurasi tambahan.
    #
    #  `Alias` menunjuk LANGSUNG ke public/, bukan ke akar proyek. Menunjuk ke
    #  akar proyek membuat .env, storage/, dan seluruh kode PHP bisa diunduh
    #  siapa pun — dan tidak ada apa pun yang memberi tahu bahwa itu terjadi.
    # ==========================================================================
    Alias /antaride /var/www/antaride-be/public

    <Directory /var/www/antaride-be/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        # RewriteBase WAJIB untuk subfolder.
        #
        # `public/.htaccess` bawaan Laravel tidak memuatnya, dan tanpa itu
        # aturan rewrite-nya menghasilkan path relatif terhadap AKAR domain —
        # sehingga /antaride/admin/login dialihkan ke /index.php, di luar
        # subfolder.
        #
        # Disetel di sini, bukan di .htaccess: .htaccess ikut di repo, dan
        # nilainya berbeda antara lokal (tidak ada) dan server.
        RewriteEngine On
        RewriteBase /antaride/

        <IfModule mod_php.c>
            php_admin_value upload_max_filesize 12M
            php_admin_value post_max_size 13M
        </IfModule>
    </Directory>

    # Aset Metronic: cache 7 hari. Namanya TIDAK ber-hash, jadi cache setahun
    # berarti pengguna melihat CSS lama sampai membersihkan cache sendiri.
    <LocationMatch "^/antaride/assets/.*\.(css|js|png|jpe?g|gif|svg|woff2?|ttf|eot|ico)$">
        Header set Cache-Control "public, max-age=604800"
    </LocationMatch>

    # Aset Vite ber-hash: boleh setahun.
    <LocationMatch "^/antaride/build/.*\.(css|js|woff2?|ttf|eot|svg)$">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>

    # ==========================================================================
    #  BLOK B — proxy ke Octane  (NONAKTIF)
    # ==========================================================================
    #  Buka komentar SELURUH blok ini, dan komentari `Alias` beserta
    #  `<Directory>` di blok A. Keduanya tidak boleh aktif bersamaan: yang
    #  menang bergantung pada urutan, dan itu bukan sesuatu yang boleh
    #  menentukan apakah aplikasi berjalan.
    # ==========================================================================
    #
    #  # Berkas statis TETAP dilayani Apache, tidak lewat Octane. Aset Metronic
    #  # ada 1.677 berkas; melewatkannya ke Octane berarti setiap pemuatan
    #  # halaman panel memakan worker PHP yang seharusnya melayani pemesanan.
    #  Alias /antaride/assets /var/www/antaride-be/public/assets
    #  Alias /antaride/build  /var/www/antaride-be/public/build
    #
    #  <Directory /var/www/antaride-be/public>
    #      Options -Indexes +FollowSymLinks
    #      Require all granted
    #  </Directory>
    #
    #  # `!` berarti JANGAN di-proxy. Harus disebut SEBELUM ProxyPass umum di
    #  # bawahnya — Apache memakai aturan pertama yang cocok.
    #  ProxyPass /antaride/assets !
    #  ProxyPass /antaride/build  !
    #
    #  # Trailing slash di KEDUA sisi. Itu yang membuat Apache MEMOTONG
    #  # /antaride sebelum meneruskan — route Laravel didefinisikan tanpa
    #  # prefix subfolder, jadi prefix yang diteruskan apa adanya menjadi 404
    #  # dari Laravel.
    #  ProxyPass        /antaride/ http://127.0.0.1:8000/
    #  ProxyPassReverse /antaride/ http://127.0.0.1:8000/
    #
    #  <Location /antaride/>
    #      # INI BARIS YANG PALING PENTING DI BLOK B.
    #      #
    #      # Tanpa dia, Laravel tidak tahu dia di subfolder — dan seluruh URL
    #      # yang dihasilkannya kehilangan /antaride. Halaman pertamanya
    #      # terbuka, lalu setiap link di dalamnya 404.
    #      #
    #      # TANPA garis miring di akhir: Laravel menambahkannya sendiri.
    #      RequestHeader set X-Forwarded-Prefix "/antaride"
    #
    #      # Apache mengisi X-Forwarded-For dan X-Forwarded-Host sendiri, tapi
    #      # TIDAK X-Forwarded-Proto. Tanpa itu url() menghasilkan http:// di
    #      # server HTTPS.
    #      RequestHeader set X-Forwarded-Proto "https"
    #  </Location>
    #
    #  ProxyTimeout 120

    # Tanpa garis miring: /antaride → /antaride/
    RedirectMatch 301 ^/antaride$ /antaride/

    ErrorLog  ${APACHE_LOG_DIR}/antaride-error.log
    CustomLog ${APACHE_LOG_DIR}/antaride-access.log combined
</VirtualHost>

<VirtualHost *:80>
    ServerName domain-anda.id

    # ACME tetap lewat HTTP, kalau tidak sertifikatnya tidak bisa diperbarui.
    Alias /.well-known/acme-challenge /var/www/html/.well-known/acme-challenge

    <Directory /var/www/html/.well-known/acme-challenge>
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^(.*)$ https://%{HTTP_HOST}$1 [R=301,L]
</VirtualHost>
