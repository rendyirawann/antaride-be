# ==============================================================================
#  Antaride di SUBFOLDER — https://domain-anda.id/antaride/
# ==============================================================================
#  Ganti tiga hal saja:
#      domain-anda.id      → domain Anda
#      /antaride           → nama subfolder Anda
#      /var/www/antaride-be → lokasi hasil clone
#
#  Pasang:
#      sudo cp antaride-subfolder.conf /etc/nginx/sites-available/antaride
#      sudo ln -s /etc/nginx/sites-available/antaride /etc/nginx/sites-enabled/
#      sudo nginx -t && sudo systemctl reload nginx
# ==============================================================================
#
#  ============================================================================
#   MASALAH INTINYA: OCTANE TIDAK TAHU APA-APA SOAL SUBFOLDER
#  ============================================================================
#   Octane mendengarkan di 127.0.0.1:8000 dan melayani dari AKAR. Nginx yang
#   memotong /antaride sebelum meneruskan, jadi Laravel melihat /admin/login —
#   bukan /antaride/admin/login.
#
#   Akibatnya kalau tidak ditangani: SETIAP route(), url(), dan asset()
#   menghasilkan tautan TANPA subfolder. Halaman pertamanya terbuka — pengguna
#   mengetik URL-nya sendiri — lalu setiap link di dalamnya 404. Termasuk form
#   login, yang action-nya menunjuk ke luar subfolder.
#
#   Yang menyelesaikannya satu header: X-Forwarded-Prefix. Nginx mengirimkannya
#   di bawah, dan Laravel mempercayainya karena bootstrap/app.php mendaftarkan
#   HEADER_X_FORWARDED_PREFIX — yang TIDAK termasuk bawaan Laravel.
#
#   Dijaga tests/Feature/Http/SubfolderDeploymentTest.php.
#  ============================================================================

# ------------------------------------------------------------------------------
#  Upstream
# ------------------------------------------------------------------------------
#  Dinamai supaya muncul jelas di log galat. Dengan proxy_pass ke IP langsung,
#  pesan galatnya menyebut 127.0.0.1:8000 — yang tidak memberi tahu apa pun
#  di server yang menjalankan beberapa aplikasi.
upstream antaride_octane {
    server 127.0.0.1:8000 fail_timeout=0;

    # Koneksi keep-alive ke Octane. Tanpa ini setiap request membuka socket TCP
    # baru ke localhost — murah, tapi pada beban tinggi menghabiskan port
    # ephemeral dan gejalanya "Cannot assign requested address" di log Nginx.
    keepalive 32;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name domain-anda.id;

    # --------------------------------------------------------------------------
    #  TLS
    # --------------------------------------------------------------------------
    ssl_certificate     /etc/letsencrypt/live/domain-anda.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/domain-anda.id/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    # --------------------------------------------------------------------------
    #  Unggahan
    # --------------------------------------------------------------------------
    #  Dokumen KYC dibatasi 8 MB di validator Laravel. Angka di sini HARUS lebih
    #  besar: kalau Nginx yang menolak, yang diterima aplikasi adalah 413 dari
    #  Nginx — halaman HTML, bukan JSON. Aplikasi Flutter menguraikannya sebagai
    #  response tidak dikenali dan menampilkan "terjadi gangguan", tanpa menyebut
    #  ukuran berkas sama sekali.
    #
    #  Dengan 12 MB, penolakan datang dari Laravel beserta pesan yang menyebut
    #  batasnya — dan driver tahu harus memfoto ulang, bukan mencoba lagi.
    client_max_body_size 12M;

    # Unggahan dari jaringan seluler lambat. Bawaan 60 detik memutus unggahan
    # dokumen yang sebenarnya berjalan normal di 3G.
    client_body_timeout 120s;

    # --------------------------------------------------------------------------
    #  Header keamanan
    # --------------------------------------------------------------------------
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # ==========================================================================
    #  BERKAS STATIS — DILAYANI NGINX, TIDAK LEWAT OCTANE
    # ==========================================================================
    #  Aset Metronic ada 1.677 berkas. Melewatkannya ke Octane berarti setiap
    #  pemuatan halaman panel admin memakan puluhan worker PHP untuk mengirim
    #  berkas yang tidak berubah — dan worker itu yang seharusnya melayani
    #  pemesanan.
    #
    #  --------------------------------------------------------------------------
    #  KENAPA SYMLINK, BUKAN `alias`
    #  --------------------------------------------------------------------------
    #  Kombinasi `alias` + `try_files` punya sejarah panjang menghasilkan path
    #  yang salah — dan salahnya senyap: yang terjadi 404 pada berkas yang ada.
    #
    #  Dengan symlink, `root` menunjuk ke direktori yang benar-benar memuat
    #  subfolder-nya sebagai direktori nyata, dan try_files bekerja apa adanya:
    #
    #      sudo ln -s /var/www/antaride-be/public /var/www/html/antaride
    #
    #  Itu satu perintah, dan menghilangkan seluruh kelas bug ini.
    # ==========================================================================
    location ^~ /antaride/ {
        root /var/www/html;

        # Berkas yang ADA dilayani langsung. Yang tidak ada diteruskan ke
        # Octane — di situlah seluruh route Laravel berada.
        try_files $uri @antaride_app;

        # Aset ber-hash boleh di-cache lama; yang tidak ber-hash tidak boleh.
        location ~* ^/antaride/build/.*\.(css|js|woff2?|ttf|eot|svg)$ {
            root /var/www/html;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        location ~* ^/antaride/assets/.*\.(css|js|png|jpe?g|gif|svg|woff2?|ttf|eot|ico)$ {
            root /var/www/html;

            # 7 hari, bukan 1 tahun: nama berkas Metronic TIDAK ber-hash, jadi
            # pembaruan tema tidak mengubah namanya. Cache setahun berarti
            # pengguna melihat CSS lama sampai dia membersihkan cache sendiri.
            expires 7d;
            add_header Cache-Control "public";
            access_log off;
        }

        # ----------------------------------------------------------------------
        #  BERKAS YANG TIDAK BOLEH DILAYANI SAMA SEKALI
        # ----------------------------------------------------------------------
        #  Symlink di atas menunjuk ke `public/`, jadi `.env` dan `storage/`
        #  memang sudah di luar jangkauan. Blok ini jaring kedua — untuk saat
        #  ada yang mengubah symlink-nya ke akar proyek "supaya lebih mudah".
        location ~ /\.(?!well-known) {
            deny all;
            access_log off;
            log_not_found off;
        }
    }

    # Tanpa garis miring: /antaride → /antaride/
    #
    # 301, bukan 302: alamatnya permanen, dan 301 di-cache browser sehingga
    # kunjungan berikutnya tidak melewati pengalihan lagi.
    location = /antaride {
        return 301 /antaride/;
    }

    # ==========================================================================
    #  KE OCTANE
    # ==========================================================================
    location @antaride_app {
        # ----------------------------------------------------------------------
        #  MEMOTONG SUBFOLDER SEBELUM DITERUSKAN
        # ----------------------------------------------------------------------
        #  Route Laravel didefinisikan TANPA prefix subfolder: `/admin/login`,
        #  bukan `/antaride/admin/login`. Kalau prefix-nya diteruskan apa adanya,
        #  setiap request menjadi 404 dari Laravel — bukan dari Nginx, sehingga
        #  terlihat seperti route yang salah.
        #
        #  `break` menghentikan pemrosesan rewrite, lalu proxy_pass TANPA URI
        #  meneruskan path yang sudah di-rewrite.
        #
        #  `/?` dalam pola menangani /antaride dan /antaride/ sekaligus.
        rewrite ^/antaride/?(.*)$ /$1 break;

        proxy_pass http://antaride_octane;
        proxy_http_version 1.1;

        # ----------------------------------------------------------------------
        #  HEADER YANG MENGEMBALIKAN SUBFOLDER KE LARAVEL
        # ----------------------------------------------------------------------
        #  INI BARIS YANG PALING PENTING DI SELURUH BERKAS INI.
        #
        #  Tanpa dia, Laravel tidak punya cara mengetahui bahwa dia berada di
        #  subfolder — dan seluruh URL yang dihasilkannya kehilangan /antaride.
        #
        #  TANPA garis miring di akhir. Laravel menambahkannya sendiri; dengan
        #  garis miring, hasilnya `//` di tengah path — yang 404 di sebagian
        #  konfigurasi dan dialihkan di sebagian lain, mengubah POST menjadi GET.
        proxy_set_header X-Forwarded-Prefix /antaride;

        # Skema asli. Nginx yang memegang TLS; ke Octane dia bicara HTTP biasa.
        # Tanpa header ini, url() menghasilkan http:// di server HTTPS.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port  $server_port;

        # Host asli, supaya url() memakai domain yang benar — bukan nama
        # upstream.
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;

        # IP asli pengguna.
        #
        # Rate limit OTP, allowlist IP admin, dan admin_login_attempts semuanya
        # membacanya. Tanpa header ini semuanya melihat IP Nginx — jadi rate
        # limit OTP menjadi rate limit GLOBAL: satu orang yang meminta OTP
        # berulang memblokir SELURUH pengguna.
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

        # Koneksi upstream tidak boleh membawa header Connection dari klien.
        proxy_set_header Connection        "";

        # ----------------------------------------------------------------------
        #  Timeout
        # ----------------------------------------------------------------------
        #  Lebih panjang daripada bawaan 60 detik untuk mengakomodasi unggahan
        #  dokumen dari jaringan seluler.
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        # Buffering DIMATIKAN untuk unggahan.
        #
        #  Dengan buffering aktif, Nginx menunggu SELURUH body diterima sebelum
        #  meneruskannya. Untuk unggahan 8 MB di jaringan lambat itu berarti
        #  Octane baru mulai memprosesnya setelah semuanya sampai — dan
        #  indikator kemajuan di aplikasi driver melompat dari 0% ke 100%
        #  tanpa apa pun di antaranya.
        proxy_request_buffering off;
    }

    # ==========================================================================
    #  DOKUMEN KYC — SIGNED URL, JANGAN DIBUAT PUBLIK
    # ==========================================================================
    #  Disk `kyc` menerbitkan URL bertanda tangan pada jalur /dokumen-kyc.
    #  Jalurnya harus IKUT subfolder: APP_URL di .env memuat /antaride, dan
    #  config/filesystems.php menyusun URL-nya dari sana.
    #
    #  Route-nya ada DI DALAM Laravel (route bernama storage.kyc), jadi dia
    #  otomatis lewat @antaride_app di atas. TIDAK ada blok location tersendiri
    #  di sini, dan itu disengaja: location yang melayani direktori KYC langsung
    #  dari disk akan melewati pemeriksaan tanda tangan sepenuhnya — siapa pun
    #  yang menebak nama berkas bisa mengunduh KTP.
    # ==========================================================================

    access_log /var/log/nginx/antaride-access.log;
    error_log  /var/log/nginx/antaride-error.log warn;
}

# ------------------------------------------------------------------------------
#  HTTP → HTTPS
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name domain-anda.id;

    # ACME tetap boleh lewat HTTP, kalau tidak sertifikatnya tidak bisa
    # diperbarui.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
