# ==============================================================================
#  Antaride di SUBDOMAIN — https://api.domain-anda.id/
# ==============================================================================
#  Alternatif dari antaride-subfolder.conf. Pilih SALAH SATU.
#
#  Kalau bisa memilih, PILIH INI. Alasannya bukan kerapian:
#
#    * Tidak ada X-Forwarded-Prefix, tidak ada rewrite, tidak ada symlink —
#      seluruh kelas bug "subfolder hilang" tidak ada di sini.
#
#    * Cookie sesi admin terpisah dari aplikasi lain di domain yang sama. Di
#      subfolder, dua aplikasi Laravel di satu domain saling menimpa cookie
#      sesinya kalau SESSION_PATH tidak disetel — dan gejalanya pengguna yang
#      "keluar sendiri" saat berpindah antar aplikasi.
#
#    * Panel admin bisa diberi lapisan yang tidak dipakai API: allowlist IP di
#      level Nginx, basic auth untuk staging, header lebih ketat. Di subfolder
#      keduanya berada di server block yang sama.
#
#  Yang berubah di .env kalau memakai ini:
#      APP_URL=https://api.domain-anda.id
#      API_DOMAIN=api.domain-anda.id
#      ADMIN_DOMAIN=admin.domain-anda.id     (kalau admin dipisah juga)
#
#  Pasang:
#      sudo cp antaride-subdomain.conf /etc/nginx/sites-available/antaride
#      sudo ln -s /etc/nginx/sites-available/antaride /etc/nginx/sites-enabled/
#      sudo nginx -t && sudo systemctl reload nginx
# ==============================================================================

upstream antaride_octane {
    server 127.0.0.1:8000 fail_timeout=0;
    keepalive 32;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name api.domain-anda.id;

    # Document root langsung ke public/ — tanpa symlink, tanpa alias.
    root /var/www/antaride-be/public;
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/api.domain-anda.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.domain-anda.id/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Lihat penjelasan angkanya di antaride-subfolder.conf: harus LEBIH BESAR
    # daripada batas 8 MB di validator Laravel, supaya penolakannya datang dari
    # Laravel beserta pesan yang menyebut ukurannya — bukan 413 HTML dari Nginx.
    client_max_body_size 12M;
    client_body_timeout 120s;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # --------------------------------------------------------------------------
    #  Berkas statis dilayani Nginx
    # --------------------------------------------------------------------------
    location ~* ^/build/.*\.(css|js|woff2?|ttf|eot|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 7 hari, bukan setahun: nama berkas Metronic tidak ber-hash, jadi pembaruan
    # tema tidak mengubah namanya.
    location ~* ^/assets/.*\.(css|js|png|jpe?g|gif|svg|woff2?|ttf|eot|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # --------------------------------------------------------------------------
    #  Selebihnya ke Octane
    # --------------------------------------------------------------------------
    location / {
        try_files $uri @antaride_app;
    }

    location @antaride_app {
        proxy_pass http://antaride_octane;
        proxy_http_version 1.1;

        # TIDAK ada X-Forwarded-Prefix di sini — aplikasi memang di akar.
        #
        # Menambahkannya bernilai "/" akan membuat setiap URL berawalan `//`,
        # yang dibaca browser sebagai protocol-relative URL: `//admin/login`
        # menjadi permintaan ke host bernama "admin".
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header Connection        "";

        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
        proxy_request_buffering off;
    }

    access_log /var/log/nginx/antaride-access.log;
    error_log  /var/log/nginx/antaride-error.log warn;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.domain-anda.id;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
